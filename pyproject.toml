[project]
name = "medgemma-modal-vllm"
version = "0.1.0"
description = "Deploy google/medgemma-27b-it to Modal with vLLM (OpenAI-compatible)"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5",
    "huggingface_hub[hf_transfer]>=0.34",
    "aiohttp>=3.10",
]

[tool.modal]
app = "medgemma_vllm.py"
